[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithmic-trading"
version = "2.0.0"
description = "Multi-asset algorithmic trading system: v1 momentum + v2 macro regime rotation"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "scipy",
    "pandas>=2.0",
    "plotly>=6.0",
    "streamlit>=1.50",
    "yfinance>=1.2",
    "pyarrow>=23.0",
    "requests>=2.31",
    "tzdata>=2025.1",
    "scikit-learn>=1.5",
]

[tool.setuptools.packages.find]
include = ["v1*", "v2*"]
