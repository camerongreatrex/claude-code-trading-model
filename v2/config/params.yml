# v2/config/params.yml
# Configuration parameters for the v2 macro regime rotation system.

capital: 100000
start_date: "2010-01-01"
end_date: "2026-01-01"

# Risk management
target_vol: 0.12              # 12% annualized vol target
vol_scale_cap: 1.5            # max leverage scalar
vol_scale_floor: 0.3          # min leverage scalar

# Drawdown circuit breaker
max_dd_trigger: -0.12         # drawdown threshold
dd_exposure_cut: 0.40         # cut gross exposure by this fraction
dd_restore_threshold: -0.08   # restore when DD recovers above this

# Stress override
stress_override_threshold: 2.0  # std devs for stress override

# Portfolio constraints
max_single_etf: 0.30          # no single ETF > 30%
max_asset_class: 0.60         # no asset class > 60%

# Rebalance
rebalance_freq: "M"           # monthly rebalance

# Regime classification
regime_states:
  - Expansion
  - Slowdown
  - Recession
  - Recovery
  - Stagflation
  - Late_Cycle

# Walk-forward validation
wf_windows: 3
train_expand: true            # expanding training window

# Success gates
gate_net_sharpe: 0.55
gate_wf_sharpe_min: 0.2
gate_max_dd: -0.25
gate_bootstrap_pvalue: 0.05
gate_cost_drag_bps: 80
