name: End-of-Day Pipeline

on:
  schedule:
    # Two cron times handle the EST/EDT shift so the pipeline always fires
    # near 4:45 PM Eastern, regardless of daylight saving time:
    #   20:45 UTC = 4:45 PM EDT (summer, Mar–Nov)
    #   21:45 UTC = 4:45 PM EST (winter, Nov–Mar)
    # The duplicate-day guard in end_of_day_update() prevents double processing
    # when both fire on the same calendar day.
    - cron: '45 20 * * 1-5'
    - cron: '45 21 * * 1-5'

  # Also lets you trigger a run manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  eod:
    runs-on: ubuntu-latest

    # Give the job write access so it can commit state back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the full history so git push works correctly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run catch-up and end-of-day update
        run: |
          python -c "
          from v1.scripts.paper_trader import catchup_all_instances, end_of_day_update, use_pt_instance, load_state, ALL_PT_INSTANCES
          catchup_all_instances()
          for inst in ALL_PT_INSTANCES:
              with use_pt_instance(inst):
                  if load_state():
                      end_of_day_update()
          "

      - name: Commit and push portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/v1/paper_trading/state.json data/v1/paper_trading/history.csv data/v1/paper_trading/trades.csv
          git add data/v1/paper_trading_v4nf_3mo/state.json data/v1/paper_trading_v4nf_3mo/history.csv data/v1/paper_trading_v4nf_3mo/trades.csv
          # Only commit if something actually changed (avoids empty commits on holidays)
          git diff --staged --quiet && exit 0
          git commit -m "EOD update $(date -u '+%Y-%m-%d')"
          # Pull latest with rebase to avoid push rejection if user committed in parallel
          git pull --rebase origin main
          git push
