name: End-of-Day Pipeline

on:
  schedule:
    # 21:45 UTC = 4:45 PM EST (winter) / 5:45 PM EDT (summer)
    # Runs after market close every weekday. Data is fully settled by then.
    - cron: '45 21 * * 1-5'

  # Also lets you trigger a run manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  eod:
    runs-on: ubuntu-latest

    # Give the job write access so it can commit state back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the full history so git push works correctly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run end-of-day update
        run: python -c "from paper_trader import end_of_day_update; end_of_day_update()"

      - name: Commit updated portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_trading/state.json data/paper_trading/history.csv
          # Only commit if something actually changed (avoids empty commits on holidays)
          git diff --staged --quiet || git commit -m "EOD update $(date -u '+%Y-%m-%d')"
          git push
