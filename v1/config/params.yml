# v1/config/params.yml
# Configuration parameters for the v1 momentum system.

capital: 100000
start_date: "2010-01-01"
end_date: "2026-01-01"

# Signal parameters (from signal_generation.py)
ma_fast: 50
ma_slow: 200
adx_threshold: 25
rsi_entry_threshold: 70
atr_trailing_mult: 3.0
min_hold_days: 5

# Portfolio sizing
risk_per_trade: 0.01        # 1% of capital per ATR
max_position_pct: 0.15      # 15% max single position
vol_target: 0.10            # 10% annualized vol target
dd_trigger: -0.12           # drawdown circuit breaker

# Transaction costs
cost_per_side: 0.0005       # 5 bps per side (10 bps round-trip)

# Trend ensemble (Improvement #1 — signal_generation.py)
trend_ensemble:
  short_fast: 20    # Voter 1: MA20 > MA50 (early trend signal)
  short_slow: 50
  med_fast: 50      # Voter 2: MA50 > MA150 (intermediate trend)
  med_slow: 150
  long_fast: 100    # Voter 3: MA100 > MA200 (structural trend)
  long_slow: 200

# Pullback re-entry inside trends
pullback:
  rsi_low: 40       # entry RSI floor (deeper → use oversold_bounce)
  rsi_high: 55      # entry RSI ceiling
  rsi_exit: 65      # exit when momentum recovers
  adx_min: 18       # require some trend structure
  lookback_days: 5  # bars to look back for the dip touching MA20

# Donchian-55 breakout (Turtle System 2)
donchian55:
  window: 55        # 55-day high (vs 20-day in breakout_entry_signal)
  adx_min: 18
